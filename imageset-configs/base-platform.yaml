# Summary: OpenShift platform payload only. Always included.
#
# This is the minimum for a disconnected install: one pinned release version
# and nothing else. Everything beyond this comes from a profile.
#
# Fragments are assembled by scripts/12-compose-imageset.sh using the
# >>> / <<< section markers below. Each section is emitted into the matching
# key of the generated ImageSetConfiguration.

# >>> header
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1

# Split archives to fit the transport medium, in GB. Remove to accept the
# 500 GB default. Pair with --strict-archive if the medium has a hard limit.
archiveSize: 100
# <<< header

# >>> platform
    architectures:
      - "${OCP_ARCH}"

    channels:
      # minVersion == maxVersion pins to a single z-stream. A range mirrors
      # every release between the two, which multiplies the payload for no
      # benefit unless you are deliberately staging an upgrade path.
      - name: ${OCP_CHANNEL}
        type: ocp
        minVersion: ${OCP_VERSION}
        maxVersion: ${OCP_VERSION}

    # Mirror the Cincinnati update graph. This adds a graph-data image and
    # generates updateService.yaml, which the install side applies to run
    # the OpenShift Update Service in-cluster. With OSUS the cluster offers
    # recommended updates and upgrades run as `oc adm upgrade --to`.
    #
    # Set false only if you have decided not to run OSUS. Upgrades are then
    # by digest -- `oc adm upgrade --to-image --allow-explicit-upgrade` --
    # which is supported, but the cluster will show no available updates.
    # Reversing this later costs another mirror run and transfer, so decide
    # before the first mirror. See docs/02-plan-your-content.md.
    graph: true
# <<< platform

# >>> operators
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v${OCP_MINOR}
      packages:
        # The OpenShift Update Service, which consumes the graph-data image
        # that `graph: true` above mirrors. Without this operator installed,
        # updateService.yaml has nothing to act on and the cluster still
        # shows no available updates -- so the two belong together. Drop
        # both if you have decided against OSUS.
        #
        # The package is `update-service-operator`. `cincinnati-operator` is
        # the upstream image name and is NOT the OLM package; using it gets
        # you "no related images found" with no indication why.
        - name: update-service-operator
          channels:
            - name: v1
# <<< operators

# >>> additionalImages
    # Diagnostics. Mirror these now -- you cannot fetch them later when
    # something is broken, which is exactly when you will want them.
    - name: registry.redhat.io/rhel9/support-tools:latest
    - name: registry.redhat.io/openshift4/ose-must-gather:latest
    - name: registry.redhat.io/ubi9/ubi:latest
# <<< additionalImages
