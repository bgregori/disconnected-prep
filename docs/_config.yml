---
title: disconnected-prep
tagline: >-
  Getting OpenShift content across an air gap, on FIPS-enabled, STIG-hardened RHEL 9.
description: >-
  A tested, self-contained procedure for mirroring OpenShift into a disconnected
  environment: content planning, oc-mirror v2, transfer, mirror registry, verification,
  and a handoff bundle for the install team.

# Project pages are served from https://<user>.github.io/<repo>/, so baseurl must match the
# repository name. Clear both of these if the site ever moves to a custom domain.
url: https://bgregori.github.io
baseurl: /disconnected-prep

repo_url: https://github.com/bgregori/disconnected-prep
repo_blob: https://github.com/bgregori/disconnected-prep/blob/main

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

# Enabled by default on GitHub Pages; declared so local `jekyll serve` matches.
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Chapter rail, left of the content. `file` is matched against page.name to mark
